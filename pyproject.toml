[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gene2wire"
version = "0.3.0"
description = "Reproducible positive-unlabeled multitarget projection models and experiment protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
experiments = [
  "pandas>=2.1",
  "scikit-learn>=1.3",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "rdata==1.1.0",
  "openpyxl>=3.1",
]
notebooks = [
  "nbformat>=5.9",
  "ipython>=8.18",
  "ipykernel>=6.25",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
